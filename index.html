<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  addDoc,
  collection,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBwwlCkGQcqWiULRU_6SE_zQ_kMxYBx8mk",
  authDomain: "t5x-ldkn.firebaseapp.com",
  databaseURL: "https://t5x-ldkn-default-rtdb.firebaseio.com",
  projectId: "t5x-ldkn",
  storageBucket: "t5x-ldkn.firebasestorage.app",
  messagingSenderId: "278540583487",
  appId: "1:278540583487:web:631a100fd6a286962eae8a",
  measurementId: "G-LSDEL437QQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);


/* ================= ADMIN UID ================= */

const ADMIN_UID = "oNSKRlCO5SeQ4gXtyyNB7CDK7dx1";


/* ================= GLOBAL ================= */

let currentUser = null;
let selectedPhotoFile = null;
let unsubscribeUserChat = null;
let unsubscribeAdminChat = null;
let unsubscribeUsers = null;


/* ================= PAGE NAVIGATION ================= */

window.showPage = function(page) {
  document.querySelectorAll(".page").forEach(p => {
    p.style.display = "none";
  });

  const target = document.getElementById(page);

  if (target) {
    target.style.display = "block";
    window.scrollTo(0, 0);
  }
};


/* ================= AUTH ================= */

window.signup = async function() {

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!name || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  try {

    const result = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = result.user;

    await updateProfile(user, {
      displayName: name
    });

    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      name: name,
      email: email,
      photoURL: "",
      createdAt: serverTimestamp()
    });

    alert("Account created successfully!");

    showPage("dashboard");

  } catch (error) {

    console.error(error);
    alert(error.message);
  }
};


window.login = async function() {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("Enter email and password.");
    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    showPage("dashboard");

  } catch (error) {

    console.error(error);
    alert(error.message);
  }
};


window.forgotPassword = async function() {

  const email = prompt("Enter your registered email:");

  if (!email) return;

  try {

    await sendPasswordResetEmail(auth, email);

    alert("Password reset email sent.");

  } catch (error) {

    console.error(error);
    alert(error.message);
  }
};


window.logout = async function() {

  try {

    await signOut(auth);

    if (unsubscribeUserChat) {
      unsubscribeUserChat();
      unsubscribeUserChat = null;
    }

    if (unsubscribeAdminChat) {
      unsubscribeAdminChat();
      unsubscribeAdminChat = null;
    }

    showPage("home");

  } catch (error) {

    console.error(error);
  }
};


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth, async user => {

  currentUser = user;

  if (user) {

    updateDashboard(user);

    if (document.getElementById("dashboard")) {
      showPage("dashboard");
    }

    if (user.uid === ADMIN_UID) {
      const adminPanel = document.getElementById("adminPanel");

      if (adminPanel) {
        adminPanel.style.display = "block";
      }
    }

  } else {

    const adminPanel = document.getElementById("adminPanel");

    if (adminPanel) {
      adminPanel.style.display = "none";
    }
  }

});


/* ================= DASHBOARD ================= */

function updateDashboard(user) {

  const name = user.displayName || "User";

  const welcome = document.getElementById("welcomeName");

  if (welcome) {
    welcome.textContent = name;
  }

  const dashboardName =
    document.getElementById("dashboardName");

  if (dashboardName) {
    dashboardName.textContent = name;
  }

  const dashboardEmail =
    document.getElementById("dashboardEmail");

  if (dashboardEmail) {
    dashboardEmail.textContent = user.email || "";
  }

  const photo =
    document.getElementById("dashboardProfilePhoto");

  const defaultAvatar =
    document.getElementById("dashboardDefaultAvatar");

  if (user.photoURL) {

    if (photo) {
      photo.src = user.photoURL;
      photo.style.display = "block";
    }

    if (defaultAvatar) {
      defaultAvatar.style.display = "none";
    }

  } else {

    if (photo) {
      photo.style.display = "none";
    }

    if (defaultAvatar) {
      defaultAvatar.style.display = "flex";
    }
  }
}


/* ================= EDIT PROFILE ================= */

window.showEditProfile = function() {

  if (!currentUser) return;

  const box = document.getElementById("editProfileBox");

  if (box) {
    box.style.display = "block";
  }

  const nameInput =
    document.getElementById("editProfileName");

  const emailInput =
    document.getElementById("editProfileEmail");

  const photo =
    document.getElementById("editProfilePhoto");

  const defaultAvatar =
    document.getElementById("editDefaultAvatar");

  if (nameInput) {
    nameInput.value = currentUser.displayName || "";
  }

  if (emailInput) {
    emailInput.value = currentUser.email || "";
  }

  if (currentUser.photoURL) {

    if (photo) {
      photo.src = currentUser.photoURL;
      photo.style.display = "block";
    }

    if (defaultAvatar) {
      defaultAvatar.style.display = "none";
    }

  } else {

    if (photo) {
      photo.style.display = "none";
    }

    if (defaultAvatar) {
      defaultAvatar.style.display = "flex";
    }
  }
};


window.closeEditProfile = function() {

  const box = document.getElementById("editProfileBox");

  if (box) {
    box.style.display = "none";
  }

  selectedPhotoFile = null;

  const input =
    document.getElementById("profilePhotoInput");

  if (input) {
    input.value = "";
  }
};


window.previewProfilePhoto = function(event) {

  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    event.target.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Image must be less than 5MB.");
    event.target.value = "";
    return;
  }

  selectedPhotoFile = file;

  const reader = new FileReader();

  reader.onload = function(e) {

    const photo =
      document.getElementById("editProfilePhoto");

    const defaultAvatar =
      document.getElementById("editDefaultAvatar");

    if (photo) {
      photo.src = e.target.result;
      photo.style.display = "block";
    }

    if (defaultAvatar) {
      defaultAvatar.style.display = "none";
    }
  };

  reader.readAsDataURL(file);
};


window.saveProfile = async function() {

  if (!currentUser) return;

  const nameInput =
    document.getElementById("editProfileName");

  const name = nameInput
    ? nameInput.value.trim()
    : "";

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  try {

    let photoURL = currentUser.photoURL || "";

    if (selectedPhotoFile) {

      const photoRef = ref(
        storage,
        `profilePhotos/${currentUser.uid}/${Date.now()}_${selectedPhotoFile.name}`
      );

      await uploadBytes(
        photoRef,
        selectedPhotoFile
      );

      photoURL = await getDownloadURL(photoRef);
    }

    await updateProfile(currentUser, {
      displayName: name,
      photoURL: photoURL
    });

    await setDoc(
      doc(db, "users", currentUser.uid),
      {
        uid: currentUser.uid,
        name: name,
        email: currentUser.email || "",
        photoURL: photoURL,
        updatedAt: serverTimestamp()
      },
      {
        merge: true
      }
    );

    updateDashboard(currentUser);

    closeEditProfile();

    alert("Profile updated successfully.");

  } catch (error) {

    console.error(error);
    alert(error.message);
  }
};


/* ================= USER CHAT ================= */

window.sendUserMessage = async function() {

  if (!currentUser) {
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("userMessage");

  if (!input) return;

  const message = input.value.trim();

  if (!message) return;

  try {

    await addDoc(
      collection(
        db,
        "chats",
        currentUser.uid,
        "messages"
      ),
      {
        senderId: currentUser.uid,
        senderName: currentUser.displayName || "User",
        message: message,
        createdAt: serverTimestamp()
      }
    );

    input.value = "";

  } catch (error) {

    console.error(error);
    alert(error.message);
  }
};


function loadUserChat() {

  if (!currentUser) return;

  const chatBox =
    document.getElementById("userChatMessages");

  if (!chatBox) return;

  if (unsubscribeUserChat) {
    unsubscribeUserChat();
  }

  unsubscribeUserChat = onSnapshot(
    collection(
      db,
      "chats",
      currentUser.uid,
      "messages"
    ),
    snapshot => {

      chatBox.innerHTML = "";

      snapshot.forEach(docSnap => {

        const data = docSnap.data();

        const div = document.createElement("div");

        div.className =
          data.senderId === currentUser.uid
            ? "message user-message"
            : "message admin-message";

        div.textContent = data.message;

        chatBox.appendChild(div);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  );
}


/* ================= ADMIN ================= */

window.loadAdminUsers = function() {

  if (!currentUser || currentUser.uid !== ADMIN_UID) {
    return;
  }

  const usersBox =
    document.getElementById("adminUsers");

  if (!usersBox) return;

  if (unsubscribeUsers) {
    unsubscribeUsers();
  }

  unsubscribeUsers = onSnapshot(
    collection(db, "users"),
    snapshot => {

      usersBox.innerHTML = "";

      snapshot.forEach(docSnap => {

        const user = docSnap.data();

        if (user.uid === ADMIN_UID) return;

        const button =
          document.createElement("button");

        button.className = "admin-user";

        button.textContent =
          user.name || user.email || "User";

        button.onclick = function() {
          openAdminChat(user.uid);
        };

        usersBox.appendChild(button);
      });
    }
  );
};


window.openAdminChat = function(uid) {

  const chatBox =
    document.getElementById("adminChatMessages");

  if (!chatBox) return;

  if (unsubscribeAdminChat) {
    unsubscribeAdminChat();
  }

  unsubscribeAdminChat = onSnapshot(
    collection(
      db,
      "chats",
      uid,
      "messages"
    ),
    snapshot => {

      chatBox.innerHTML = "";

      snapshot.forEach(docSnap => {

        const data = docSnap.data();

        const div =
          document.createElement("div");

        div.className =
          data.senderId === ADMIN_UID
            ? "message admin-message"
            : "message user-message";

        div.textContent = data.message;

        chatBox.appendChild(div);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  );

  const sendButton =
    document.getElementById("adminSendButton");

  if (sendButton) {

    sendButton.onclick = async function() {

      const input =
        document.getElementById("adminMessage");

      if (!input) return;

      const message =
        input.value.trim();

      if (!message) return;

      try {

        await addDoc(
          collection(
            db,
            "chats",
            uid,
            "messages"
          ),
          {
            senderId: ADMIN_UID,
            senderName: "Admin",
            message: message,
            createdAt: serverTimestamp()
          }
        );

        input.value = "";

      } catch (error) {

        console.error(error);
        alert(error.message);
      }
    };
  }
};


/* ================= START CHAT ================= */

document.addEventListener("DOMContentLoaded", () => {

  const chatButton =
    document.getElementById("openUserChat");

  if (chatButton) {

    chatButton.addEventListener(
      "click",
      () => {
        loadUserChat();
      }
    );
  }

  const adminButton =
    document.getElementById("openAdminUsers");

  if (adminButton) {

    adminButton.addEventListener(
      "click",
      () => {
        loadAdminUsers();
      }
    );
  }

});
</script>
