            border: 1px solid #263656;

            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: #00e5ff;
            color: #001018;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0,229,255,.4);

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #9da7bc;

        .signup a {
